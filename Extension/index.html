<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiltrFeed</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="header">
            <img src="icon.jpeg" alt="FiltrFeed" class="icon">
            <span>FiltrFeed</span>
        </div>

        <section class="focus">
            <div class="heading">
                Focus Points:
                <div id="pointsTime" class="points">10:00</div>
            </div>
            <div class="desc">Spend Wisely</div>
        </section>

        <form id="settingsForm">
            <div class="inputLabel">About Me:</div>
            <textarea
                id="aboutMe"
                placeholder="Describe your background, interests and learning goals..."
            ></textarea>

            <div class="inputLabel api-label">Gemini API Key:</div>
            <input
                id="geminiApiKey"
                type="password"
                autocomplete="off"
                placeholder="AIza..."
            >

            <button type="submit" class="update">Save</button>
            <div id="status" class="status" aria-live="polite"></div>
        </form>

        <button class="usePoints" id="usePoints" type="button">Use Points</button>
    </main>

    <script src="index.js"></script>
</body>
</html>
